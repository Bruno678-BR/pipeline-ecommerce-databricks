# Job para orquestrar o pipeline declarativo e os testes de qualidade

resources:
  jobs:
    job_pipeline_ecommerce:
      name: Pipeline E-commerce

      parameters:
        - name: catalogo
          default: ${var.catalog}

      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_ecommerce.id}

        - task_key: testes_qualidade
          depends_on:
            - task_key: refresh_pipeline
          notebook_task:
            notebook_path: ../testes/testes_qualidade.py
            base_parameters:
              catalogo: ${var.catalog}
